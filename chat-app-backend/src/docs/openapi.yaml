openapi: 3.0.3
info:
  title: MyChat App API
  description: API documentation for MyChat backend (users endpoints)
  version: 1.0.0
servers:
  - url: http://localhost:3000
paths:
  /api/users/create-account:
    post:
      summary: Create a new user account
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userName
                - firstName
                - lastName
                - email
                - password
              properties:
                userName:
                  type: string
                  example: jdoe
                firstName:
                  type: string
                  example: John
                middleName:
                  type: string
                  example: A.
                lastName:
                  type: string
                  example: Doe
                email:
                  type: string
                  format: email
                  example: jdoe@example.com
                password:
                  type: string
                  format: password
                  example: secret123
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      userName:
                        type: string
                        example: jdoe
                      email:
                        type: string
                        example: jdoe@example.com
                      createdAt:
                        type: string
                        format: date-time
        '400':
          description: Validation error
        '500':
          description: Server error

  /api/users/login:
    post:
      summary: Login user
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: OK
        '400':
          description: Invalid credentials

components:
  securitySchemes: {}
